<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
</head>

<body>
    <button>Get Players</button>
    <script>
        async function getB1CastPlayer(macAddress) {
            try {
                const url = `https://localhost:5001/api/wcs/B1CastPlayers/GetB1CastPlayer?macAddress=${macAddress}`;

                const response = await fetch(url, {
                    method: "GET",
                    headers:{
                        "Content-Type": "application/json"
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json()
                if (result.success && result.data) {
                    console.log("✅ 查询成功:", result.data);
                    return result.data; 
                } else {
                    console.warn("⚠️ 查询无结果或失败:", result.error);
                    return null;
                }
            } catch (error) {
                console.error("❌ 请求异常:", error);
                throw error;
            }
        }
        
        getB1CastPlayer("00:1A:2B:3C:4D:5E")

    </script>
</body>

</html>
