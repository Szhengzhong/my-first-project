            margin: 0px;

        }

        body {
            min-height: 100%;
            overflow: hidden;
            background-color: #000
        }

        @-webkit-keyframes move {
            100% {
                -webkit-transform: translate3d(0, 0, -1000px);
                transform: translate3d(0, 0, -1000px);
            }
        }

        @keyframes move {
            100% {
                -webkit-transform: translate3d(0, 0, -1000px);
                transform: translate3d(0, 0, -1000px);
            }
        }

        .logo {
            position: absolute;
            bottom: 5%;
            left: 4%;
            height: 5%;
        }

        .display {
            width: 100%;
            position: absolute;
            left: 0;
            bottom: 0;
            display: flex;
            justify-content: flex-end;
        }

        .inner {
            display: flex;
            padding: 2%;
        }

        .bordered {
            display: flex;
            flex-direction: column;
            border-radius: 5px;
            padding: 20px 40px;
            white-space: nowrap;
            background-color: #00000099;
            color: #fff;
        }

        #date {
            font-size: calc(20px + 4 * ((100vw - 1920px) / 1080));
        }

        #time {
            font-size: calc(70px + 4 * ((100vw - 1920px) / 1080));
        }

        .container {
            position: relative;
            width: 100%;
            min-height: 100%;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;

            transform-origin: center center;
            -webkit-perspective: 600px;
            perspective: 600px;

    <script>
        function setTime() {
            const now = new Date();

            document.getElementById("date").innerHTML = now.toLocaleDateString("en-US", {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            });

            let hours = now.getHours();
            let minutes = now.getMinutes();

            if (minutes < 10) {
                minutes = `0${minutes}`;
            }

            let ampm = "AM";

            if (hours > 12) {
                hours -= 12;
                ampm = "PM";
            }

            document.getElementById("time").innerHTML = `${hours}:${minutes} ${ampm}`;
        }

        setTime();

        setInterval(() => {
            setTime();
        }, 1000);
    </script>
