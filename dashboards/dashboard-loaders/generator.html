<html lang="en">

<head>
    <meta charset="utf-8">
    <title>URL Generator</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet">
    <script src="https://support.encompass8.com/aspx1/includes/EWSAll.min.js"></script>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            padding: 20px;
        }

        .fieldset {
            padding: 20px;
            margin: 0 0 20px 0;
            border: 1px #dfdfdf solid;
            border-radius: 3px;
        }

        .row {
            width: 600px;
            display: flex;
        }

        .field {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin: 0 10px 0 0;
        }

        input {
            padding: 7px;
            border-radius: 3px;
            border: 1px #dfdfdf solid;
            margin: 3px 0 10px 0;
            font-size: 14px;
        }

        input:focus {
            outline: 0 none;
            border: 1px #1f5186 solid;
        }

        label {
            color: #7c7c7c;
            font-size: 14px;
        }

        button {
            background: #1f5186;
            color: #fff !important;
            text-decoration: none !important;
            font-size: 14px;
            text-align: center;
            display: inline-block;
            border: 1px #1f5186 solid;
            border-radius: 3px;
            padding: 10px;
            box-sizing: border-box;
            cursor: pointer;
            user-select: none;
            margin: 0 10px 0 0;
            white-space: pre;
        }

        button:hover {
            box-shadow: 0 1px 1px 0 rgba(0, 0, 0, 0.14),
                0 2px 1px -1px rgba(0, 0, 0, 0.12), 0 1px 3px 0 rgba(0, 0, 0, 0.2);
        }

        button:focus {
            outline: 0 none;
        }

        #results {
            width: 100%;
            font-size: 24px;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="fieldset">
        <div class="row">
            <div class="field">
                <label for="host">Host</label>
                <input type="text" id="host" />
            </div>

            <div class="field">
                <label for="distributor">Distributor</label>
                <input type="text" id="distributor" />
            </div>
        </div>

        <div class="row">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" />
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" />
            </div>
        </div>

        <div class="row">
            <div class="field">
                <label for="url">URL</label>
                <input type="text" id="url" />
            </div>
        </div>

        <button onclick="Generate()">Generate</button>
    </div>

    <label for="results">Results</label>
    <input type="text" id="results" />
    <script>
        function EmbedURL(url) {
            if (!url.startsWith("http://") && !url.startsWith("https://")) {
                url = url.replace(/&EmbededDialog=True/gi, "").replace(/\?EmbededDialog=True/gi, "");

                if (url.indexOf("?") >= 0) {
                    url += "&";
                } else {
                    url += "?";
                }

                url += "EmbededDialog=True";
            }

            return url;
        }

        function LoginURL(host, distributor, username, password, url) {
            let support = false;

            username = username.toLowerCase().trim();

            if (username.endsWith("$")) {
                username = username.slice(0, -1);
                support = true;
            }

            const email = EC_Fmt.isEmail(username);

            username = EC_Fmt.MD5(username);
            password = EC_Fmt.MD5(password);

            if (support) {
                username += "$";
            }

            if (email) {
                username = `@${username}`;
            }

            return `https://images.encompass8.com/GlobalDocs/414635.html?${btoa(`https://${host}/aspx1/Home.aspx?Distributor=${distributor}&LogOnType=LogOn&Style=${username}&Theme=${password}&DestURL=${encodeURIComponent(EmbedURL(url))}`)}`;
        }

        function Generate() {
            const host = document.getElementById("host").value;
            const distributor = document.getElementById("distributor").value;
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const url = document.getElementById("url").value;

            document.getElementById("results").value = LoginURL(host, distributor, username, password, url);
        }
    </script>
</body>
